<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">ComfyUI NVIDIA DLSS 5 Visual Enhancer</title>
  <desc id="desc">A mobile pipeline diagram showing ComfyUI media passing through DLSS acceleration and enhancement before returning to the workflow.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1518"/><stop offset="1" stop-color="#0a0d15"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#76b900"/><stop offset="0.55" stop-color="#57e6b1"/><stop offset="1" stop-color="#57b8ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#57e6b1"/></marker></defs>
  <rect x="1" y="1" width="638" height="718" rx="18" fill="url(#bg)" stroke="#2b3a46" stroke-width="2"/>
  <rect x="1" y="1" width="7" height="718" rx="3.5" fill="url(#accent)"/>
  <text x="34" y="44" fill="#76b900" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">FLAGSHIP / GPU VIDEO</text>
  <text x="34" y="82" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="750">ComfyUI NVIDIA DLSS 5</text>
  <text x="34" y="112" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="750">Visual Enhancer</text>
  <g font-family="ui-monospace, Consolas, monospace">
    <rect x="34" y="146" width="572" height="100" rx="10" fill="#101b24" stroke="#34495b"/><text x="58" y="176" fill="#71869a" font-size="14">SOURCE / 01</text><text x="58" y="209" fill="#e8eef5" font-size="20" font-weight="700">VIDEO · IMAGE</text><text x="349" y="209" fill="#71869a" font-size="16">native workflow input</text>
    <path d="M320 252V278" stroke="#57e6b1" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="34" y="290" width="572" height="100" rx="10" fill="#102019" stroke="#527d39"/><text x="58" y="320" fill="#76b900" font-size="14">ACCELERATE / 02</text><text x="58" y="353" fill="#eef7e8" font-size="20" font-weight="700">DLSS RUNTIME</text><text x="349" y="353" fill="#7fa174" font-size="16">GPU execution path</text>
    <path d="M320 396V422" stroke="#57e6b1" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="34" y="434" width="572" height="100" rx="10" fill="#0f1d24" stroke="#2d6672"/><text x="58" y="464" fill="#57e6b1" font-size="14">ENHANCE / 03</text><text x="58" y="497" fill="#e7f8f2" font-size="20" font-weight="700">FPS · SR · NR</text><text x="349" y="497" fill="#70968d" font-size="16">interpolate · upscale</text>
    <path d="M320 540V566" stroke="#57b8ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="34" y="578" width="572" height="100" rx="10" fill="#101824" stroke="#31516e"/><text x="58" y="608" fill="#57b8ff" font-size="14">RETURN / 04</text><text x="58" y="641" fill="#eaf4ff" font-size="20" font-weight="700">COMPOSABLE</text><text x="349" y="641" fill="#718ba2" font-size="16">save downstream</text>
  </g>
</svg>
