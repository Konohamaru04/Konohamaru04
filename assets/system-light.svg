<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Engineering system status</title>
  <desc id="desc">Four active engineering domains: product systems, model layer, compute path, and open source.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#148a63"/><stop offset="0.55" stop-color="#0969da"/><stop offset="1" stop-color="#6e40c9"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="228" rx="16" fill="#ffffff" stroke="#c7d2df" stroke-width="2"/>
  <text x="34" y="41" fill="#607286" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2">SYSTEM / ACTIVE SURFACES</text>
  <rect x="1027" y="24" width="139" height="28" rx="14" fill="#eaf8f1" stroke="#8dcbb4"/>
  <circle cx="1048" cy="38" r="4" fill="#148a63"/>
  <text x="1062" y="43" fill="#126c50" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.2">BUILD MODE</text>
  <path d="M34 65H1166" stroke="#c7d2df"/>
  <path d="M300 88V196M600 88V196M900 88V196" stroke="#d8e1eb"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="34" y="109" fill="#148a63" font-size="13" letter-spacing="1.6">01 / PRODUCT</text>
    <text x="34" y="144" fill="#17202b" font-size="21" font-weight="700">FULL-STACK</text>
    <text x="34" y="174" fill="#607286" font-size="15">web · desktop · services</text>

    <text x="334" y="109" fill="#0969da" font-size="13" letter-spacing="1.6">02 / MODEL LAYER</text>
    <text x="334" y="144" fill="#17202b" font-size="21" font-weight="700">AI SYSTEMS</text>
    <text x="334" y="174" fill="#607286" font-size="15">training · agents · inference</text>

    <text x="634" y="109" fill="#365fa8" font-size="13" letter-spacing="1.6">03 / COMPUTE</text>
    <text x="634" y="144" fill="#17202b" font-size="21" font-weight="700">GPU PIPELINES</text>
    <text x="634" y="174" fill="#607286" font-size="15">video · vision · acceleration</text>

