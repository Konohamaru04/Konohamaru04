<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Engineering system status</title>
  <desc id="desc">Four active engineering domains: product systems, model layer, compute path, and open source.</desc>
  <defs>
