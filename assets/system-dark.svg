    <text x="34" y="109" fill="#57e6b1" font-size="13" letter-spacing="1.6">01 / PRODUCT</text>
    <text x="34" y="144" fill="#eef3f8" font-size="21" font-weight="700">FULL-STACK</text>
    <text x="34" y="174" fill="#71869a" font-size="15">web · desktop · services</text>

