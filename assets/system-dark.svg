      <stop offset="0" stop-color="#57e6b1"/><stop offset="0.55" stop-color="#57b8ff"/><stop offset="1" stop-color="#9a7cff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="228" rx="16" fill="#0b1118" stroke="#26384a" stroke-width="2"/>
  <text x="34" y="41" fill="#7d90a4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2">SYSTEM / ACTIVE SURFACES</text>
  <rect x="1027" y="24" width="139" height="28" rx="14" fill="#11281f" stroke="#2b7056"/>
  <circle cx="1048" cy="38" r="4" fill="#57e6b1"/>
