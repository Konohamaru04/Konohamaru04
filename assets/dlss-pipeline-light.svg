<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">ComfyUI NVIDIA DLSS 5 Visual Enhancer</title>
  <desc id="desc">A technical pipeline diagram showing native ComfyUI media passing through DLSS frame generation and neural rendering to produce enhanced video or images.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f8fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f9400"/><stop offset="0.55" stop-color="#148a63"/><stop offset="1" stop-color="#0969da"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#148a63"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="278" rx="18" fill="url(#bg)" stroke="#c7d2df" stroke-width="2"/>
  <rect x="1" y="1" width="8" height="278" rx="4" fill="url(#accent)"/>
  <text x="42" y="47" fill="#5f9400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">FLAGSHIP / GPU VIDEO PIPELINE</text>
  <text x="42" y="82" fill="#17202b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="750">ComfyUI NVIDIA DLSS 5 Visual Enhancer</text>
  <text x="1155" y="55" text-anchor="end" fill="#607286" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">NATIVE COMFYUI TYPES · DIAGNOSTIC OUTPUT</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect x="42" y="124" width="220" height="92" rx="10" fill="#f7f9fc" stroke="#c7d2df"/>
    <text x="62" y="151" fill="#607286" font-size="13" letter-spacing="1.5">SOURCE / 01</text>
    <text x="62" y="181" fill="#17202b" font-size="18" font-weight="700">VIDEO · IMAGE</text>
    <text x="62" y="202" fill="#607286" font-size="14">native workflow input</text>

    <path d="M277 170H322" stroke="#148a63" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="338" y="124" width="230" height="92" rx="10" fill="#f3f9ef" stroke="#9ab879"/>
    <text x="358" y="151" fill="#5f9400" font-size="13" letter-spacing="1.5">ACCELERATE / 02</text>
    <text x="358" y="181" fill="#25331c" font-size="18" font-weight="700">DLSS RUNTIME</text>
    <text x="358" y="202" fill="#557047" font-size="14">GPU execution path</text>

    <path d="M583 170H628" stroke="#148a63" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="644" y="124" width="230" height="92" rx="10" fill="#eff9f5" stroke="#8ac6ae"/>
    <text x="664" y="151" fill="#148a63" font-size="13" letter-spacing="1.5">ENHANCE / 03</text>
    <text x="664" y="181" fill="#17362b" font-size="18" font-weight="700">FPS · SR · NR</text>
    <text x="664" y="202" fill="#477264" font-size="14">interpolate · upscale</text>

    <path d="M889 170H934" stroke="#0969da" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="950" y="124" width="205" height="92" rx="10" fill="#f1f7fd" stroke="#8eb7df"/>
    <text x="970" y="151" fill="#0969da" font-size="13" letter-spacing="1.5">RETURN / 04</text>
    <text x="970" y="181" fill="#17283a" font-size="18" font-weight="700">COMPOSABLE</text>
    <text x="970" y="202" fill="#536f89" font-size="14">save downstream</text>
  </g>
  <text x="42" y="250" fill="#607286" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.1">FRAME INTERPOLATION  /  VIDEO UPSCALE  /  IMAGE UPSCALE</text>
</svg>
